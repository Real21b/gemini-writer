[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-writer"
version = "2.0.0"
description = "AI-powered creative writing agent using Google Gemini – fullstack with FastAPI backend and React frontend"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.24.0",
]

[project.scripts]
gemini-writer = "writer:main"
gemini-server = "backend.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["backend", "tools", "utils.py", "writer.py"]
